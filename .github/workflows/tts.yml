name: Narrate script

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to read (e.g. narration/oldcathedral.txt)
        required: true
      voices:
        description: Kokoro voices, comma-separated (e.g. af_heart,am_michael)
        required: true
        default: af_heart
      sections:
        description: '"all" or section numbers, e.g. 1 or 1,3'
        required: true
        default: all
      speed:
        description: Speaking speed (1.0 is normal)
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install "kokoro==0.9.4" soundfile "spacy==3.8.7" https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Narrate
        run: python .github/scripts/tts.py "${{ inputs.script }}" "${{ inputs.voices }}" "${{ inputs.sections }}" "${{ inputs.speed }}"
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add narration/out
          git commit -m "Narration audio for ${{ inputs.script }}"
          git pull --rebase
          git push
