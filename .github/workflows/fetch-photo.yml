name: Fetch landmark photo

on:
  workflow_dispatch:
    inputs:
      place_id:
        description: Place id used in data.js (e.g. puck)
        required: true
      article:
        description: English Wikipedia article title (e.g. Puck Building)
        required: true
      file:
        description: Optional Commons file name to use instead of the article's main image
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python .github/scripts/fetch_photo.py "$PLACE_ID" "$ARTICLE" "$FILE"
        env:
          PLACE_ID: ${{ inputs.place_id }}
          ARTICLE: ${{ inputs.article }}
          FILE: ${{ inputs.file }}
      - name: Commit photo
        env:
          PLACE_ID: ${{ inputs.place_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets dist/credits.js
          git commit -m "Add $PLACE_ID photo from Wikimedia Commons"
          git push
