name: Fetch landmark photo

on:
  workflow_dispatch:
    inputs:
      items:
        description: 'One per line or separated by ";": id=Wikipedia article, id=File:Commons file.jpg, or id=search:Commons search'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fetch photos
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          mapfile -t specs < <(printf '%s' "$ITEMS" | tr ';' '\n' | sed '/^[[:space:]]*$/d')
          python .github/scripts/fetch_photo.py "${specs[@]}"
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets dist/credits.js
          git commit -m "Add landmark photos from Wikimedia Commons"
          git push
