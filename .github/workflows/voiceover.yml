name: Demo voiceover (temporary)
on:
  push:
    branches: [voiceover-tts]
    paths: ['vo/lines.json', 'vo/make.py', '.github/workflows/voiceover.yml']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install -q kokoro-onnx soundfile && curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx && curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin 2>&1 | tail -20 | tee pip-log.txt
      - name: Voice
        continue-on-error: true
        run: mkdir -p vo/out && (python vo/make.py af_heart,am_michael 2>&1; echo "exit $?") | tee vo/out/log.txt
      - name: Commit
        if: always()
        run: |
          mkdir -p vo/out && cp pip-log.txt vo/out/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vo/out && git commit -m "Voiceover clips" && git push
